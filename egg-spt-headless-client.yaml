    script: |-
      #!/bin/bash
      # Fika Headless Client

      cd /mnt/server
      cat > readme.txt <<'EOF'
      Upload the complete SPT + Fika Headless client installation into this server directory.
      Configure a Pelican volume mount that exposes this directory at /opt/tushonka.
      The container also requires a persistent volume mounted at /wine for its Wine prefix.
      The image expects UDP port 25565 to be allocated and reachable.
      EOF

